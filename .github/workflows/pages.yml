# Builds the web app and publishes it to GitHub Pages on every push to main:
# https://abbas357.github.io/cashflow/
#
# One-time setup: Settings > Pages > Source: GitHub Actions.
name: Web app on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      # Served from /cashflow/, not the site root.
      - run: >-
          flutter build web --release --no-web-resources-cdn --base-href /cashflow/
          --dart-define=BUILD_ID=${{ github.sha }}

      # A plain refresh then loads the new build (see the script).
      - run: dart tool/web_cache_bust.dart ${{ github.sha }}

      # Pages has no rewrite rules. Unknown paths (a refresh on
      # /cashflow/insights) get 404.html, which is the app itself, so it
      # opens on the page in the address.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
